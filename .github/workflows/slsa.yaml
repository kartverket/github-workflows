name: On-Bårding SLSA Attestation Workflow
on:
  workflow_call:
    inputs:
      registry:
        type: string
        required: true
      image_name:
        type: string
        required: true
permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}
  RBAC_FILE_PATH: config/rbac/role.yaml
  CRD_APP_FILE_PATH: config/crd/skiperator.kartverket.no_applications.yaml
  CRD_JOB_FILE_PATH: config/crd/skiperator.kartverket.no_skipjobs.yaml
  CRD_ROUTING_FILE_PATH: config/crd/skiperator.kartverket.no_routings.yaml
  ARTIFACT_NAME: skiperator-artifact-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  generate-attestation:
    runs-on: ubuntu-latest
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Install Syft for SBOM Generation
        shell: bash
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Release with Goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve released image digest
        id: image-digest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          image="${REGISTRY}/${IMAGE_NAME}:${GITHUB_REF_NAME}"
          digest="$(awk -v image="${image}" '$2 == image { print $1; found = 1 } END { exit !found }' dist/digests.txt)"
          if [[ "${digest}" != sha256:* ]]; then
            digest="sha256:${digest}"
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Generate image SBOM
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          syft "${REGISTRY}/${IMAGE_NAME}@${{ steps.image-digest.outputs.digest }}" -o spdx-json=dist/skiperator-image.spdx.json

      - name: Attest image SBOM
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image-digest.outputs.digest }}
          push-to-registry: true
          sbom-path: dist/skiperator-image.spdx.json
          create-storage-record: true

      - name: Attest released image provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image-digest.outputs.digest }}
          push-to-registry: true
          create-storage-record: true
